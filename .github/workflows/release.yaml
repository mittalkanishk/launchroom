name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/reusable-release-workflow.yaml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}

  publish-release:
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish GitHub release
        uses: release-drafter/release-drafter@v7.10.0
        with:
          tag: ${{ github.ref_name }}
          name: launchroom ${{ github.ref_name }}
          publish: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
