name: "Reusable Release Image Template"

on:
  workflow_dispatch:
    inputs:
      service:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  release-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_REPO: kanishkmittal55/launchroom
      SERVICE: ${{ inputs.service }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker Buildx Setup
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub Login
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Railway runs linux/amd64, so that is the only platform built.
      - name: Release Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file "docker/${SERVICE}/Dockerfile" \
            --tag "${IMAGE_REPO}:${SERVICE}-${VERSION}" \
            --tag "${IMAGE_REPO}:${SERVICE}-latest" \
            --push \
            .
